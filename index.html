<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple task manager built with HTML, CSS, and JavaScript.">
  <title>TaskFlow | To-Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="app-title">
      <header class="app-header">
        <p class="eyebrow">Personal productivity</p>
        <h1 id="app-title">TaskFlow</h1>
        <p class="subtitle">A simple task list made with HTML, CSS, and JavaScript.</p>
      </header>

      <form id="taskForm" class="task-form">
        <label class="sr-only" for="taskInput">New task</label>
        <input id="taskInput" type="text" placeholder="What do you need to do?" maxlength="120" required autocomplete="off">
        <button type="submit">Add task</button>
      </form>

      <ul id="taskList" class="task-list" aria-label="Tasks"></ul>
      <p id="emptyState" class="empty-state">No tasks here yet. Add your first task above.</p>

      <footer class="app-footer">
        <span>Your tasks are saved in this browser.</span>
      </footer>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
